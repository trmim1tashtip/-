name: Publish single HTML page

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare standalone page
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s index.html ]; then
            echo "::error::Place index.html in the repository root before publishing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp index.html "$RUNNER_TEMP/pages-site/index.html"

      - name: Upload Pages archive
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
